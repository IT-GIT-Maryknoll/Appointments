name: Build and Publish .NET 9 for IIS

on:
  push:
    branches:
      - main # Triggers the workflow when code is pushed to the main branch
  workflow_dispatch: # Allows you to manually trigger this workflow from GitHub

jobs:
  build-and-publish:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup .NET 9 SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '9.0.x'

    - name: Restore Dependencies
      run: dotnet restore -r win-x64

    - name: Build Application
      run: dotnet build --configuration Release -r win-x64 --no-restore

    # Target runtime changed to win-x64 for Windows IIS hosting
    - name: Publish Application
      run: dotnet publish --configuration Release -r win-x64 --output ./publish --no-build

    - name: Upload Build Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: iis-publish-package
        path: ./publish/
